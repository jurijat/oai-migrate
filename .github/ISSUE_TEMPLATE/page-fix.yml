name: Report a problem with a page
description: Something is wrong, out of date, or broken on the site
labels: [content]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://www.openapis.org/about
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it say instead?
