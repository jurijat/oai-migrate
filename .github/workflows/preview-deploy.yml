name: Preview deploy

on:
  workflow_run:
    workflows: [Preview build]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: pr
        run: |
          number=$(cat out/.pr-number)
          rm out/.pr-number
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=$(npx --yes wrangler@4 pages deploy out \
            --project-name=openapis-org \
            --branch="pr-${{ steps.pr.outputs.number }}" \
            --commit-dirty=true \
            | tee /dev/stderr \
            | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.pr.outputs.number }}
          header: preview
          message: |
            ### Preview ready

            | | |
            |---|---|
            | Preview | ${{ steps.deploy.outputs.url }} |
            | Commit | `${{ github.event.workflow_run.head_sha }}` |

            Rebuilt on every push to this pull request.
